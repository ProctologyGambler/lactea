<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- horns -->
  <path d="M 28 28 Q 24 22 22 18" stroke="#d4a574" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 72 28 Q 76 22 78 18" stroke="#d4a574" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="20" cy="40" rx="10" ry="14" fill="#fff" stroke="#333" stroke-width="2.5" transform="rotate(-20 20 40)"/>
  <ellipse cx="80" cy="40" rx="10" ry="14" fill="#fff" stroke="#333" stroke-width="2.5" transform="rotate(20 80 40)"/>
  <ellipse cx="20" cy="42" rx="5" ry="9" fill="#ffc4d6" transform="rotate(-20 20 42)"/>
  <ellipse cx="80" cy="42" rx="5" ry="9" fill="#ffc4d6" transform="rotate(20 80 42)"/>
  <!-- head -->
  <circle cx="50" cy="55" r="32" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <!-- spots -->
  <ellipse cx="36" cy="40" rx="10" ry="8" fill="#333"/>
  <ellipse cx="66" cy="45" rx="8" ry="6" fill="#333"/>
  <!-- eyes (open) -->
  <circle cx="40" cy="58" r="4.5" fill="#333"/>
  <circle cx="60" cy="58" r="4.5" fill="#333"/>
  <circle cx="41.5" cy="56.5" r="1.5" fill="#fff"/>
  <circle cx="61.5" cy="56.5" r="1.5" fill="#fff"/>
  <!-- snout -->
  <ellipse cx="50" cy="73" rx="20" ry="13" fill="#ffc4d6" stroke="#333" stroke-width="2.5"/>
  <!-- nostrils -->
  <ellipse cx="44" cy="73" rx="2" ry="3" fill="#333"/>
  <ellipse cx="56" cy="73" rx="2" ry="3" fill="#333"/>
  <!-- smile -->
  <path d="M 42 78 Q 50 82 58 78" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
