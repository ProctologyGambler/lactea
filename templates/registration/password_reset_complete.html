{% extends "auth_base.html" %}

{% block title %}Password reset — {{ c.brand_name }}{% endblock %}

{% block content %}
<div class="skin-card p-6 space-y-4 text-center">
    <h1 class="skin-heading text-2xl font-semibold">Password reset complete</h1>
    <p class="skin-text-muted">You can now sign in with your new password.</p>
    <a href="{% url 'login' %}" class="skin-btn-primary inline-block px-6 py-3 rounded-2xl font-medium">
        Sign in
    </a>
</div>
{% endblock %}
