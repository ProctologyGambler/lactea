{% extends "auth_base.html" %}

{% block title %}Reset password — {{ c.brand_name }}{% endblock %}

{% block content %}
<div class="skin-card p-6 space-y-5">
    <h1 class="skin-heading text-2xl font-semibold">Reset your password</h1>
    <p class="skin-text-muted text-sm">Enter your email and we'll send you a reset link.</p>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="id_email" class="block text-sm skin-text-muted mb-1">Email</label>
            <input type="email" name="email" id="id_email" autocomplete="email"
                   class="skin-input w-full rounded-2xl px-4 py-3" required>
        </div>
        <button type="submit" class="skin-btn-primary w-full px-4 py-3 rounded-2xl font-medium">
            Send reset link
        </button>
    </form>

    <div class="text-sm text-center skin-text-muted">
        <a href="{% url 'login' %}" class="skin-link">Back to sign in</a>
    </div>
</div>
{% endblock %}
