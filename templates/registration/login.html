{% extends "auth_base.html" %}

{% block title %}Sign in — {{ c.brand_name }}{% endblock %}

{% block content %}
<div class="skin-card p-6 space-y-5">
    <h1 class="skin-heading text-2xl font-semibold">Sign in</h1>

    {% if form.non_field_errors %}
        <div class="skin-error-box">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div>
            <label for="id_username" class="block text-sm skin-text-muted mb-1">Username</label>
            <input type="text" name="username" id="id_username" autocomplete="username"
                   class="skin-input w-full rounded-2xl px-4 py-3" required autofocus>
        </div>

        <div>
            <label for="id_password" class="block text-sm skin-text-muted mb-1">Password</label>
            <input type="password" name="password" id="id_password" autocomplete="current-password"
                   class="skin-input w-full rounded-2xl px-4 py-3" required>
        </div>

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit" class="skin-btn-primary w-full px-4 py-3 rounded-2xl font-medium">
            Sign in
        </button>
    </form>

    <div class="text-sm text-center space-y-2">
        <div><a href="{% url 'password_reset' %}" class="skin-link">Forgot your password?</a></div>
        <div class="skin-text-muted">Don't have an account? <a href="{% url 'signup' %}" class="skin-link">Sign up</a></div>
    </div>
</div>
{% endblock %}
