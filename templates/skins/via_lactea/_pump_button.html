<button id="startBtn"
        aria-label="Start pumping session"
        class="flex items-center justify-center w-32 h-32 bg-green-500 hover:bg-green-600 text-white font-bold rounded-full shadow-lg transition">
    <span class="flex flex-col items-center gap-1">
        <span class="text-5xl leading-none" aria-hidden="true">▶</span>
        <span class="text-sm tracking-widest">START</span>
    </span>
</button>

<button id="stopBtn"
        aria-label="Stop pumping session"
        class="flex items-center justify-center w-32 h-32 bg-red-500 hover:bg-red-600 text-white font-bold rounded-full shadow-lg transition hidden">
    <span class="flex flex-col items-center gap-1">
        <span class="text-5xl leading-none" aria-hidden="true">■</span>
        <span class="text-sm tracking-widest">STOP</span>
    </span>
</button>
