<button id="startBtn"
        aria-label="Start pumping session"
        class="flex items-center justify-center w-32 h-32 text-white font-semibold rounded-lg shadow transition"
        style="background: var(--accent);">
    <span class="flex flex-col items-center gap-1">
        <span class="text-3xl leading-none" aria-hidden="true">&#9658;</span>
        <span class="text-xs uppercase tracking-widest">Start</span>
    </span>
</button>

<button id="stopBtn"
        aria-label="Stop pumping session"
        class="flex items-center justify-center w-32 h-32 text-white font-semibold rounded-lg shadow transition hidden"
        style="background: #b91c1c;">
    <span class="flex flex-col items-center gap-1">
        <span class="text-3xl leading-none" aria-hidden="true">&#9632;</span>
        <span class="text-xs uppercase tracking-widest">Stop</span>
    </span>
</button>
